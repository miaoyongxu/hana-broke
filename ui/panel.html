<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hana Broke</title>
  <!-- The `?v=` on every asset is the release version from manifest.json. Bump
       it in the same commit as the version, or a WebView that holds the old
       file in memory will keep painting the old UI after an update. -->
  <link rel="stylesheet" href="./assets/panel.css?v=0.9.1">
</head>
<body data-hana-theme="inherit" data-surface="page">
  <div id="root" data-surface="page"></div>
  <script>
    // This page runs only inside HanaAgent now. It is served from the App's
    // `ui/` tree and calls the App's `/api/*` proxy, which attaches the bridge
    // bearer itself — so there is nothing secret here and nothing to configure.
    // (The bridge's own `/panel` route, which used to inject a bearer into this
    // page, no longer exists.)
    //
    // The name matters: panel.js reads `__HANABROKE__`. It used to set
    // `__WORKBUDDY__` instead, so the page silently ran on its `/admin` default
    // and every call went to a route the App host does not serve.
    window.__HANABROKE__ = { base: "/api" };
  </script>
  <!-- Palettes first, then the panel: the theme layer only sets custom
       properties, so it has to land before the panel paints. -->
  <script type="module" src="./assets/hana-theme.js?v=0.9.1"></script>
  <script type="module" src="./assets/panel.js?v=0.9.1"></script>
</body>
</html>
